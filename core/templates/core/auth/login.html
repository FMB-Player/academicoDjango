{% extends 'core/base.html' %}

{% block title %}Iniciar Sesión - Sistema Académico{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2>Iniciar Sesión</h2>
        
        <form method="post" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Email</label>
                <input type="email" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            
            {% if form.errors %}
                <div class="alert alert-error">
                    Por favor, ingrese un email y contraseña válidos.
                </div>
            {% endif %}
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>
        </form>
        
        <div class="auth-links">
            <a href="{% url 'password_reset' %}">¿Olvidó su contraseña?</a>
        </div>
    </div>
</div>
{% endblock %}
