{% extends 'core/base.html' %}

{% block title %}Acceso Denegado - Error 403{% endblock %}

{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'core/css/errors.css' %}">
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1 class="color-error">403</h1>
        <h2>Acceso Denegado</h2>
        <p>No tienes permiso para acceder a esta página.</p>
        <div class="error-actions">
            <a href="{% url 'core:home' %}" class="btn btn-primary">Ir al Inicio</a>
            <a href="javascript:history.back()" class="btn">Volver Atrás</a>
        </div>
    </div>
</div>
{% endblock %}
