{% extends 'core/base.html' %}

{% block title %}Acceso Denegado - Error 403{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1>403</h1>
        <h2>Acceso Denegado</h2>
        <p>No tienes permiso para acceder a esta página.</p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-primary">Ir al Inicio</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn">Ir al Panel</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn">Iniciar Sesión</a>
            {% endif %}
        </div>
    </div>
</div>

<style>
.error-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 2rem;
}

.error-card {
    text-align: center;
    max-width: 500px;
    width: 100%;
}

.error-card h1 {
    font-size: 6rem;
    margin: 0;
    color: var(--primary-color);
    line-height: 1;
}

.error-card h2 {
    margin-top: 0.5rem;
    margin-bottom: 1rem;
}

.error-actions {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
}

@media (max-width: 480px) {
    .error-actions {
        flex-direction: column;
    }
    
    .error-actions .btn {
        width: 100%;
    }
}
</style>
{% endblock %}
