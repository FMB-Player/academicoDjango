{% extends 'core/base.html' %}

{% block title %}Página no encontrada - Error 404{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>Lo sentimos, la página que estás buscando no existe o ha sido movida.</p>
        <div class="error-actions">
            <a href="{% url 'home' %}" class="btn btn-primary">Ir al Inicio</a>
            <a href="javascript:history.back()" class="btn">Volver Atrás</a>
        </div>
    </div>
</div>

<style>
.error-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 2rem;
}

.error-card {
    text-align: center;
    max-width: 500px;
    width: 100%;
}

.error-card h1 {
    font-size: 6rem;
    margin: 0;
    color: var(--primary-color);
    line-height: 1;
}

.error-card h2 {
    margin-top: 0.5rem;
    margin-bottom: 1rem;
}

.error-actions {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
}

@media (max-width: 480px) {
    .error-actions {
        flex-direction: column;
    }
    
    .error-actions .btn {
        width: 100%;
    }
}
</style>
{% endblock %}
